# Page: software
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: software
label: Software
icon: software
order: 7
remote_configurable: true
description: Software update preferences
sections:
- id: updates
  title: Updates
  description: Control software updates
  items:
  - key: OnroadUpdateNotice
    widget: info
    blocked: true
    title: ''
    description: Updates are only downloaded while the car is off.
    visibility:
    - type: not
      condition:
        type: offroad_only
  - key: UpdaterCurrentDescription
    widget: info
    blocked: true
    title: Current Version
  - key: DownloadUpdate
    widget: button
    blocked: true
    action: software_download
    title: Download
    description: ''
    visibility:
    - $ref: '#/macros/offroad'
  - key: InstallUpdate
    widget: button
    blocked: true
    action: software_install
    title: Install Update
    description: ''
    visibility:
    - $ref: '#/macros/offroad'
    - type: param
      key: UpdateAvailable
      equals: true
  - key: UpdaterTargetBranch
    widget: button
    blocked: true
    action: software_branch
    title: Target Branch
    description: ''
  - key: Uninstall
    widget: button
    blocked: true
    action: software_uninstall
    title: Remove sunnypilot
    description: ''
  - key: DisableUpdates
    widget: toggle
    title: Disable Updates
    description: When enabled, software updates will be off. This requires a reboot to take effect.
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/advanced_only'
