# Page: steering
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: steering
label: Steering
icon: steering_wheel
order: 1
remote_configurable: true
description: Lateral control, lane changes, and steering behavior
sections:
- id: mads
  title: Modular Assistive Driving System (MADS)
  description: ''
  items:
  - key: Mads
    widget: toggle
    title: Enable Modular Assistive Driving System (MADS)
    description: Enable MADS. This changes how lateral assist is engaged and disengaged. Disable toggle to revert back to
      stock sunnypilot engagement/disengagement.
    requires_attestation: true
    enablement:
    - $ref: '#/macros/offroad'
  sub_panels:
  - id: mads_settings
    label: MADS Settings
    trigger_key: Mads
    trigger_condition:
      type: param
      key: Mads
      equals: true
    items:
    - key: MadsMainCruiseAllowed
      widget: toggle
      title: Toggle with Main Cruise
      description: 'Allow the main cruise control to toggle MADS engagement. Note: For vehicles without LFA/LKAS button,
        disabling this will prevent lateral control engagement.'
      requires_attestation: true
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsUnifiedEngagementMode
      widget: toggle
      title: Unified Engagement Mode (UEM)
      description: 'Engage lateral and longitudinal control with cruise control engagement. UEM changes when lateral assist
        starts. Note: Once lateral control is engaged via UEM, it will remain engaged until it is manually disabled via the
        MADS button or car shut off.'
      requires_attestation: true
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsSteeringMode
      widget: multiple_button
      title: Steering Mode on Brake Pedal
      description: Choose how Automatic Lane Centering (ALC) behaves after the brake pedal is manually pressed in sunnypilot.
        Disengage is the most conservative choice; Remain Active keeps lateral assist available after braking.
      requires_attestation: true
      options:
      - value: 0
        label: Remain Active
        enablement:
        - $ref: '#/macros/mads_full_platforms'
      - value: 1
        label: Pause
        enablement:
        - $ref: '#/macros/mads_full_platforms'
      - value: 2
        label: Disengage
      enablement:
      - $ref: '#/macros/offroad'
- id: blinker
  title: Blinker Control
  description: Lateral pause behavior during turn signals
  attestation_required: true
  items:
  - key: BlinkerPauseLateralControl
    widget: toggle
    title: Pause Lateral Control with Blinker
    description: Pause lateral control with blinker when traveling below the selected speed. Lateral assist resumes after
      the blinker ends and the post-blinker delay has elapsed.
    sub_items:
    - key: BlinkerMinLateralControlSpeed
      widget: option
      title: Minimum Speed to Pause Lateral Control
      description: Below this speed, using the blinker can temporarily pause lateral assist. Set to 0 to allow the pause
        at any speed.
      min: 0
      max: 255
      step: 5
      unit:
        metric: km/h
        imperial: mph
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
    - key: BlinkerLateralReengageDelay
      widget: option
      title: Post-Blinker Delay
      description: Delay before lateral control resumes after the turn signal ends. Increase if re-engagement feels too
        abrupt after signaling.
      min: 0
      max: 10
      step: 1
      unit: second
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
- id: torque
  title: Torque Control
  description: Steering torque tuning and lateral control method
  attestation_required: true
  enablement:
  - type: capability
    field: torque_allowed
    equals: true
  items:
  - key: EnforceTorqueControl
    widget: toggle
    title: Enforce Torque Lateral Control
    description: Use Torque lateral control instead of the platform default. This changes steering response and lane-centering
      feel; turn it off to return to the default controller.
    visibility:
    - type: not
      condition:
        type: capability
        field: steer_control_type
        equals: angle
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: torque_allowed
      equals: true
    - type: param
      key: NeuralNetworkLateralControl
      equals: false
  - key: NeuralNetworkLateralControl
    widget: toggle
    title: Neural Network Lateral Control (NNLC)
    description: Use the neural-network lateral controller when supported. This changes steering behavior; turn it off to
      return to the default lateral controller.
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: torque_allowed
      equals: true
    - type: param
      key: EnforceTorqueControl
      equals: false
  sub_panels:
  - id: torque_settings
    label: Torque Settings
    trigger_key: EnforceTorqueControl
    trigger_condition:
      type: param
      key: EnforceTorqueControl
      equals: true
    items:
    - key: LiveTorqueParamsToggle
      widget: toggle
      title: Self-Tune
      description: Enables self-tune for Torque lateral control for platforms that do not use Torque lateral control by
        default. Learned values can change steering response over time; disable to stop learning and return to fixed/offline
        torque tuning.
      enablement:
      - $ref: '#/macros/offroad'
    - key: LiveTorqueSpeedAdaptiveMode
      widget: multiple_button
      title: Speed-Aware Curve
      description: Choose how learned speed correction is used. Apply mode can change steering response by speed; Off returns
        to the base torque tune.
      requires_attestation: true
      options:
      - value: 'off'
        label: 'Off'
      - value: shadow
        label: Learn only
      - value: apply
        label: Apply learned curve
      enablement:
      - $ref: '#/macros/offroad'
    - key: LiveTorqueParamsRelaxedToggle
      widget: toggle
      title: Less Restrict Settings for Self-Tune (Beta)
      description: Less strict settings when using Self-Tune. This allows torqued to be more forgiving when learning values,
        but may accept noisier steering data. Disable to return to stricter learning.
      requires_attestation: true
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: LiveTorqueParamsToggle
        equals: true
    - key: CustomTorqueParams
      widget: toggle
      title: Enable Custom Tuning
      description: Enables custom tuning for Torque lateral control. Modifying Lateral Acceleration Factor and Friction below
        will override the offline values indicated in the YAML files within "opendbc/car/torque_data". The values will also
        be used live when "Manual Real-Time Tuning" toggle is enabled. Large changes can bias steering or degrade tracking;
        turn this off to return to the selected tune.
      requires_attestation: true
      enablement:
      - $ref: '#/macros/offroad'
    - key: TorqueParamsOverrideEnabled
      widget: toggle
      title: Manual Real-Time Tuning
      description: Enforces the torque lateral controller to use the fixed values instead of the learned values from Self-Tune.
        Enabling this toggle applies the custom values live and overrides Self-Tune values. Monitor steering response and
        disable to return to learned/offline values.
      requires_attestation: true
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: CustomTorqueParams
        equals: true
    - key: TorqueParamsOverrideLatAccelFactor
      widget: option
      title: Lateral Acceleration Factor
      description: Adjusts how strongly torque maps to lateral acceleration. In Real-Time mode this can affect steering
        immediately; revert by disabling Manual Real-Time Tuning or Custom Tuning.
      requires_attestation: true
      title_param_suffix:
        param: TorqueParamsOverrideEnabled
        values:
          'true': (Real-Time & Offline)
          'false': (Offline Only)
      min: 0.1
      max: 5.0
      step: 0.1
      unit: m/s²
      enablement:
      - type: param
        key: CustomTorqueParams
        equals: true
      - type: any
        conditions:
        - type: param
          key: TorqueParamsOverrideEnabled
          equals: true
        - type: offroad_only
    - key: TorqueParamsOverrideFriction
      widget: option
      title: Friction
      description: Adjusts friction compensation for torque steering. In Real-Time mode this can affect steering immediately;
        revert by disabling Manual Real-Time Tuning or Custom Tuning.
      requires_attestation: true
      title_param_suffix:
        param: TorqueParamsOverrideEnabled
        values:
          'true': (Real-Time & Offline)
          'false': (Offline Only)
      min: 0.0
      max: 1.0
      step: 0.01
      enablement:
      - type: param
        key: CustomTorqueParams
        equals: true
      - type: any
        conditions:
        - type: param
          key: TorqueParamsOverrideEnabled
          equals: true
        - type: offroad_only
    - key: TorqueControlTune
      widget: multiple_button
      title: Torque Control Tune Version
      description: Select the Torque Control Tune version. Changes apply to torque steering behavior; return to Default to
        use the standard tune.
      requires_attestation: true
      options:
      - value: ''
        label: Default
      - value: 1.0
        label: v1.0
      - value: 0.0
        label: v0.0
      enablement:
      - $ref: '#/macros/offroad'
- id: lane_change
  title: Lane Change
  description: Automatic lane change timing and behavior
  attestation_required: true
  items:
  - key: AutoLaneChangeTimer
    widget: option
    title: Auto Lane Change by Blinker
    description: |-
      Set a timer to delay the auto lane change operation when the blinker is used. No nudge on the steering wheel is required to auto lane change if a timer is set. Default is Nudge.
    details: |-
      This changes when the car may initiate a lane change after signaling. Please use caution and only use the blinker when traffic and road conditions permit. Set to Off or Nudge to require more driver input.
    options:
    - value: -1
      label: 'Off'
    - value: 0
      label: Nudge
    - value: 1
      label: Nudgeless
    - value: 2
      label: 0.5 second
    - value: 3
      label: 1 second
    - value: 4
      label: 2 seconds
    - value: 5
      label: 3 seconds
  - key: AutoLaneChangeBsmDelay
    widget: toggle
    title: 'Auto Lane Change: Delay with Blind Spot'
    description: Toggle to enable a delay timer for lane changes when blind spot monitoring (BSM) detects a vehicle in your blind
      spot. This delays the lane-change attempt; it does not replace checking mirrors and traffic.
    enablement:
    - type: capability
      field: enable_bsm
      equals: true
    - type: param_compare
      key: AutoLaneChangeTimer
      op: '>'
      value: 0
- id: custom_lateral_demand
  title: Custom Lateral Demand
  description: ''
  attestation_required: true
  items:
  - key: CustomLateralDemandEnabled
    widget: toggle
    title: Custom Lateral Demand
    description: Process the driving model's steering curvature (quality gating + smoothing) before lateral control.
      Fail-closed to the stock curvature and still bounded by existing controller limits; off uses the stock model curvature.
      This can change the requested lane-centering path, so keep it off if tracking looks worse.
    sub_items:
    - key: LaneCenteringAssistEnabled
      widget: toggle
      title: Lane Centering Assist
      description: Nudge the processed model path toward the lane center when lane-line confidence is usable. Requires Custom
        Lateral Demand. Turn it off if the car appears to bias away from the intended lane position.
      enablement:
      - type: param
        key: CustomLateralDemandEnabled
        equals: true
    - key: CurveMemoryEnabled
      widget: toggle
      title: Corner Curve Memory
      description: Remember a corner's curvature seen at speed and hold it through low-speed stops so the car resumes the
        turn instead of forgetting it. Supplement-only and vetoed by confident vision; requires Custom Lateral Demand. Turn
        it off if stop-and-go turns feel over-predicted.
      enablement:
      - type: param
        key: CustomLateralDemandEnabled
        equals: true
    - key: LateralDebugTraceMode
      widget: multiple_button
      title: Lateral Debug Trace
      description: Add route-log-only lateral demand shadow diagnostics for path geometry validation. Logging only; no steering changes.
      options:
      - value: 'off'
        label: 'Off'
      - value: 'log'
        label: Log
      enablement:
      - type: param
        key: CustomLateralDemandEnabled
        equals: true
