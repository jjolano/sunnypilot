# Page: models
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: models
label: Models
icon: models
order: 10
remote_configurable: false
description: Driving model behavior and camera calibration
sections:
- id: model_behavior
  title: Model Behavior
  description: Lane desire and lead-vehicle awareness tuning
  items:
  - key: LaneTurnDesire
    widget: toggle
    title: Use Lane Turn Desires
    description: If you are driving at 20 mph (32 km/h) or below and have your blinker on, the car will plan a turn in that
      direction at the nearest drivable path. This changes model path intent at low speed; turn it off if the planned path
      looks wrong.
  - key: LaneTurnValue
    widget: option
    title: Adjust Lane Turn Speed
    description: Set the maximum speed where lane turn desires may be used. Raising this can make the model plan turn-like
      paths at higher speeds.
    min: 0
    max: 20
    step: 1
    unit:
      metric: km/h
      imperial: mph
    enablement:
    - type: param
      key: LaneTurnDesire
      equals: true
    - $ref: '#/macros/advanced_only'
  - key: LagdToggle
    widget: toggle
    title: Live Learning Steer Delay
    description: Allow device to learn and adapt car's steering response time. Disable to use the fixed software delay below.
  - key: LagdToggleDelay
    widget: option
    title: Adjust Software Delay
    description: Adjust the fixed software delay when Live Learning Steer Delay is off. Wrong delay can make steering response
      feel early or late; default is 0.2 s.
    min: 0.05
    max: 0.5
    step: 0.01
    enablement:
    - type: not
      condition:
        type: param
        key: LagdToggle
        equals: true
    - $ref: '#/macros/advanced_only'
- id: camera
  title: Camera
  description: Camera position and calibration
  items:
  - key: CameraOffset
    widget: option
    title: Adjust Camera Offset
    description: Virtually shift camera perspective to move the model center left (+ values) or right (- values). Non-zero
      offsets can bias the perceived path; return to 0 if lane centering looks worse.
    requires_attestation: true
    min: -0.35
    max: 0.35
    step: 0.01
    unit: meters
    enablement:
    - $ref: '#/macros/advanced_only'
