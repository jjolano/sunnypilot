# Page: cruise
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: cruise
label: Cruise
icon: cruise_control
order: 2
remote_configurable: true
description: Longitudinal control, speed limits, and cruise behavior
sections:
- id: core_cruise_features
  title: ''
  description: ''
  items:
  - key: LongitudinalMode
    widget: multiple_button
    title: Longitudinal Mode
    description: Select the top-level longitudinal behavior. ACC is deterministic cruise/follow, E2E is model-primary,
      and SCC smart-switches from explicit evidence.
    options:
    - value: 0
      label: ACC
    - value: 1
      label: E2E
      enablement:
      - type: param
        key: ExperimentalModeConfirmed
        equals: true
    - value: 2
      label: SCC
      enablement:
      - type: param
        key: ExperimentalModeConfirmed
        equals: true
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: SccCurveVisionEnabled
    widget: toggle
    title: SCC Vision Curve Control
    description: Allow SCC mode to slow for upcoming vision-predicted curves.
    visibility:
    - type: param
      key: LongitudinalMode
      equals: 2
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: SccCurveMapEnabled
    widget: toggle
    title: SCC Map Curve Control
    description: Allow SCC mode to slow for map-derived upcoming curves.
    visibility:
    - type: param
      key: LongitudinalMode
      equals: 2
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: DisengageOnAccelerator
    widget: toggle
    title: Disengage Cruise on Accelerator Pedal
    description: When enabled, pressing the accelerator pedal will disengage longitudinal control.
  - key: LongitudinalPersonality
    widget: multiple_button
    title: Driving Personality
    description: Standard is recommended. In aggressive mode, sunnypilot will follow lead cars closer and be more aggressive
      with the gas and brake. In relaxed mode sunnypilot will stay further away from lead cars. On supported cars, you can
      cycle through these personalities with your steering wheel distance button.
    options:
    - value: 0
      label: Aggressive
    - value: 1
      label: Standard
    - value: 2
      label: Relaxed
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: LongitudinalStack
    widget: multiple_button
    title: Longitudinal Stack
    description: Selects which longitudinal control stack is used after sunnypilot longitudinal control is active. Default is sunnypilot-current; custom-recommended resolves globally to custom-2.0.
    options:
    - value: sunnypilot-current
      label: sunnypilot Current
    - value: custom-recommended
      label: Custom Recommended
    - value: custom-2.0
      label: Custom v2.0
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: PlannerStack
    widget: multiple_button
    title: Planner Stack
    description: Selects which planner family is used after sunnypilot longitudinal control is active. Scene Memory v1 is validation-gated and cannot be selected for active control yet.
    options:
    - value: planner-current
      label: Planner Current
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: FastLeadMotionEvidenceEnabled
    widget: toggle
    title: Fast Lead Motion
    description: Uses raw lead opening and lead speed evidence in custom v2.0 stop/go and progress behavior.
    visibility:
    - type: any
      conditions:
      - type: param
        key: LongitudinalStack
        equals: custom-recommended
      - type: param
        key: LongitudinalStack
        equals: custom-2.0
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: OnePedalLongitudinalMode
    widget: multiple_button
    title: One Pedal Longitudinal
    description: Treats the cruise speed as a ceiling in custom v2.0. Lift-off coasts unless physical lead or stop evidence requires braking.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Creep
    - value: 2
      label: Full Stop
    visibility:
    - type: any
      conditions:
      - type: param
        key: LongitudinalStack
        equals: custom-recommended
      - type: param
        key: LongitudinalStack
        equals: custom-2.0
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: IntelligentCruiseButtonManagement
    widget: toggle
    title: Intelligent Cruise Button Management (ICBM) (Alpha)
    visibility:
    - type: capability
      field: icbm_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - type: not
      condition:
        type: capability
        field: has_longitudinal_control
        equals: true
- id: custom_acc_increments
  title: Custom ACC Speed Intervals
  description: ''
  enablement:
  - $ref: '#/macros/offroad'
  - type: any
    conditions:
    - type: all
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: not
        condition:
          type: capability
          field: pcm_cruise
          equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: CustomAccIncrementsEnabled
    widget: toggle
    title: Enable Custom ACC Speed Intervals
    enablement:
    - $ref: '#/macros/offroad'
    - type: any
      conditions:
      - type: all
        conditions:
        - type: capability
          field: has_longitudinal_control
          equals: true
        - type: not
          condition:
            type: capability
            field: pcm_cruise
            equals: true
      - type: capability
        field: has_icbm
        equals: true
  sub_panels:
  - id: custom_acc_intervals
    label: Custom ACC Speed Intervals Settings
    trigger_key: CustomAccIncrementsEnabled
    trigger_condition:
      type: param
      key: CustomAccIncrementsEnabled
      equals: true
    items:
    - key: CustomAccShortPressIncrement
      widget: option
      title: Short Press Increment
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
    - key: CustomAccLongPressIncrement
      widget: option
      title: Long Press Increment
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
- id: speed_limits
  title: Speed Limits
  description: Speed limit detection and offset behavior
  items: []
  sub_panels:
  - id: speed_limit_settings
    label: Speed Limit Settings
    trigger_key: SpeedLimitMode
    items:
    - key: SpeedLimitMode
      widget: multiple_button
      title: Speed Limit Assist Mode
      options:
      - value: 0
        label: 'Off'
      - value: 1
        label: Information
      - value: 2
        label: Warning
      - value: 3
        label: Assist
        enablement:
        - type: any
          conditions:
          - type: capability
            field: has_icbm
            equals: true
          - type: all
            conditions:
            - type: capability
              field: has_longitudinal_control
              equals: true
            - type: not
              condition:
                type: param
                key: LongitudinalMode
                equals: 0
        - type: not
          condition:
            type: capability
            field: brand
            equals: rivian
        - type: not
          condition:
            type: all
            conditions:
            - type: capability
              field: brand
              equals: tesla
            - type: capability
              field: is_sp_release
              equals: true
    - key: SpeedLimitPolicy
      widget: multiple_button
      title: Speed Limit Source
      options:
      - value: 0
        label: Car State Only
      - value: 1
        label: Map Data Only
      - value: 2
        label: Car State Priority
      - value: 3
        label: Map Data Priority
      - value: 4
        label: Combined
    - key: SpeedLimitOffsetType
      widget: multiple_button
      title: Speed Limit Offset Type
      options:
      - value: 0
        label: 'Off'
      - value: 1
        label: Fixed
      - value: 2
        label: Percentage
    - key: SpeedLimitValueOffset
      widget: option
      title: Speed Limit Offset Value
      min: -30
      max: 30
      step: 1
      unit:
        metric: km/h
        imperial: mph
      visibility:
      - type: param_compare
        key: SpeedLimitOffsetType
        op: '>'
        value: 0
