# Page: cruise
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: cruise
label: Cruise
icon: cruise_control
order: 2
remote_configurable: true
description: Longitudinal control, speed limits, and cruise behavior
sections:
- id: core_cruise_features
  title: ''
  description: ''
  items:
  - key: ExperimentalMode
    widget: toggle
    title: Experimental Mode
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: DynamicExperimentalControl
    widget: toggle
    title: Dynamic Experimental Control
    description: Let the model decide when to use sunnypilot ACC or sunnypilot End to End Longitudinal. This can change
      acceleration and braking behavior; turn it off to keep the selected longitudinal mode. Superseded by the custom Longitudinal
      Policy's SCC mode, so it is disabled while Custom Longitudinal is on.
    requires_attestation: true
    visibility:
    - $ref: '#/macros/longitudinal'
    enablement:
    - $ref: '#/macros/longitudinal'
    - type: param
      key: CustomLongitudinalEnabled
      equals: false
  - key: DynamicFollowGapMode
    widget: multiple_button
    title: Dynamic Follow Gap
    description: Monitor a bounded follow-gap compression during low-risk approaches to a slower lead, or apply it to the
      MPC follow distance. Apply mode can reduce following distance (never below 1.2 s) and requires Custom Longitudinal
      plus the research actuation gate; Monitor only makes no driving changes.
    requires_attestation: true
    options:
    - value: 'off'
      label: 'Off'
    - value: 'shadow'
      label: Monitor only
    - value: 'apply'
      label: Apply follow gap
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_longitudinal_control
      equals: true
    - type: param
      key: CustomLongitudinalEnabled
      equals: true
  - key: MapCoastMode
    widget: multiple_button
    title: Map Coast
    description: Monitor early lift-off points toward map-known slowdowns (curves, lower limits) beyond camera range, or
      apply them as coast-only speed shaping. Apply mode only eases off — it never brakes on map data — and requires Custom
      Longitudinal, the Map curve source, plus the research actuation gate; Monitor only makes no driving changes.
    requires_attestation: true
    options:
    - value: 'off'
      label: 'Off'
    - value: 'shadow'
      label: Monitor only
    - value: 'apply'
      label: Apply coast
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_longitudinal_control
      equals: true
    - type: param
      key: CustomLongitudinalEnabled
      equals: true
    - type: param
      key: SmartCruiseControlMap
      equals: true
  - key: LongitudinalDebugTraceMode
    widget: multiple_button
    title: Longitudinal Debug Trace
    description: Add structured custom longitudinal diagnostics to route logs. Logging only; no driving changes.
    options:
    - value: 'off'
      label: 'Off'
    - value: 'log'
      label: Log
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_longitudinal_control
      equals: true
    - type: param
      key: CustomLongitudinalEnabled
      equals: true
  - key: AllowLongitudinalResearchActuation
    widget: toggle
    title: Allow Longitudinal Research Actuation
    description: Enables apply/gate behavior for non-baseline longitudinal research features, such as radar-only cut-in promotion
      and experimental lead, curve, cut-in, and standstill release gates. Off keeps those features monitor-only or inactive.
    requires_attestation: true
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_longitudinal_control
      equals: true
    - type: param
      key: CustomLongitudinalEnabled
      equals: true
  - key: CutInBrakeAssistMode
    widget: multiple_button
    title: Cut-in Brake Assist
    description: Monitor close cut-in style lead events, or apply a bounded gentle braking cap when a close cut-in is detected.
      Apply mode can add gentle braking; Off returns to the base behavior. Requires Custom Longitudinal and is disabled when
      longitudinal is off.
    requires_attestation: true
    options:
    - value: 'off'
      label: 'Off'
    - value: 'shadow'
      label: Monitor only
    - value: 'apply'
      label: Apply gentle cap
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_longitudinal_control
      equals: true
    - type: param
      key: CustomLongitudinalEnabled
      equals: true
  - key: CurveSpeedConfidenceMode
    widget: multiple_button
    title: Curve Speed Confidence
    description: Monitor SCC curve evidence, or apply a conservative final accel cap when confidence is high.
    options:
    - value: 'off'
      label: 'Off'
    - value: 'shadow'
      label: Monitor only
    - value: 'apply_conservative'
      label: Apply conservative
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_longitudinal_control
      equals: true
    - type: param
      key: CustomLongitudinalEnabled
      equals: true
  - key: CurveTrafficAdvisorMode
    widget: multiple_button
    title: Curve Traffic Advisor
    description: Logs curve shape and traffic context for route validation. Apply conservative can add a bounded braking cap
      before model-predicted curves when confidence is high and traffic gates are clear.
    requires_attestation: true
    options:
    - value: 'off'
      label: 'Off'
    - value: 'shadow'
      label: Monitor only
    - value: 'apply_conservative'
      label: Apply conservative
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_longitudinal_control
      equals: true
    - type: param
      key: CustomLongitudinalEnabled
      equals: true
  - key: StandstillReleaseConfidenceMode
    widget: multiple_button
    title: Standstill Release Confidence
    description: Monitor launch-release evidence, or let the stopped-lead latch release earlier when the same lead is clearly pulling away.
    options:
    - value: 'off'
      label: 'Off'
    - value: 'shadow'
      label: Monitor only
    - value: 'gate'
      label: Release gate
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_longitudinal_control
      equals: true
    - type: param
      key: CustomLongitudinalEnabled
      equals: true
  - key: DisengageOnAccelerator
    widget: toggle
    title: Disengage Cruise on Accelerator Pedal
    description: When enabled, pressing the accelerator pedal will disengage longitudinal control. Turn it off to keep the
      default accelerator override behavior.
  - key: LongitudinalPersonality
    widget: multiple_button
    title: Driving Personality
    description: Standard is recommended. In aggressive mode, sunnypilot will follow lead cars closer and be more aggressive
      with the gas and brake. In relaxed mode sunnypilot will stay further away from lead cars. On supported cars, you can
      cycle through these personalities with your steering wheel distance button.
    options:
    - value: 0
      label: Aggressive
    - value: 1
      label: Standard
    - value: 2
      label: Relaxed
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: IntelligentCruiseButtonManagement
    widget: toggle
    title: Intelligent Cruise Button Management (ICBM) (Alpha)
    description: Emulates built-in cruise-control button presses for limited longitudinal control. This can change how cruise
      speed is adjusted; turn it off to return button behavior to the vehicle stock path.
    requires_attestation: true
    visibility:
    - type: capability
      field: icbm_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - type: not
      condition:
        type: capability
        field: has_longitudinal_control
        equals: true
- id: custom_acc_increments
  title: Custom ACC Speed Intervals
  description: ''
  enablement:
  - $ref: '#/macros/offroad'
  - type: any
    conditions:
    - type: all
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: not
        condition:
          type: capability
          field: pcm_cruise
          equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: CustomAccIncrementsEnabled
    widget: toggle
    title: Enable Custom ACC Speed Intervals
    description: Change short- and long-press cruise speed increments. Disable to return to the default increments.
    requires_attestation: true
    enablement:
    - $ref: '#/macros/offroad'
    - type: any
      conditions:
      - type: all
        conditions:
        - type: capability
          field: has_longitudinal_control
          equals: true
        - type: not
          condition:
            type: capability
            field: pcm_cruise
            equals: true
      - type: capability
        field: has_icbm
        equals: true
    sub_items:
    - key: CustomAccShortPressIncrement
      widget: option
      title: Short Press Increment
      description: Speed change applied to each short cruise-speed button press while custom intervals are enabled.
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
    - key: CustomAccLongPressIncrement
      widget: option
      title: Long Press Increment
      description: Speed change applied to each long cruise-speed button press while custom intervals are enabled.
      options:
      - value: 1
        label: '1'
      - value: 5
        label: '5'
      - value: 10
        label: '10'
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
- id: speed_limits
  title: Speed Limits
  description: Speed limit detection and offset behavior
  items: []
  sub_panels:
  - id: speed_limit_settings
    label: Speed Limit Settings
    trigger_key: SpeedLimitMode
    items:
    - key: SpeedLimitMode
      widget: multiple_button
      title: Speed Limit Assist Mode
      options:
      - value: 0
        label: 'Off'
      - value: 1
        label: Information
      - value: 2
        label: Warning
      - value: 3
        label: Assist
        enablement:
        - type: any
          conditions:
          - type: capability
            field: has_longitudinal_control
            equals: true
          - type: capability
            field: has_icbm
            equals: true
        - type: not
          condition:
            type: capability
            field: brand
            equals: rivian
        - type: not
          condition:
            type: all
            conditions:
            - type: capability
              field: brand
              equals: tesla
            - type: capability
              field: is_sp_release
              equals: true
    - key: SpeedLimitPolicy
      widget: multiple_button
      title: Speed Limit Source
      options:
      - value: 0
        label: Car State Only
      - value: 1
        label: Map Data Only
      - value: 2
        label: Car State Priority
      - value: 3
        label: Map Data Priority
      - value: 4
        label: Combined
    - key: SpeedLimitOffsetType
      widget: multiple_button
      title: Speed Limit Offset Type
      options:
      - value: 0
        label: 'Off'
      - value: 1
        label: Fixed
      - value: 2
        label: Percentage
    - key: SpeedLimitValueOffset
      widget: option
      title: Speed Limit Offset Value
      min: -30
      max: 30
      step: 1
      unit:
        metric: km/h
        imperial: mph
      visibility:
      - type: param_compare
        key: SpeedLimitOffsetType
        op: '>'
        value: 0
- id: smart_cruise
  title: Smart Cruise Control
  description: ''
  enablement:
  - type: any
    conditions:
    - type: capability
      field: has_longitudinal_control
      equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: SmartCruiseControlVision
    widget: toggle
    title: Vision
    description: Use vision path predictions to estimate the appropriate speed to drive through turns ahead.
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
  - key: SmartCruiseControlMap
    widget: toggle
    title: Map
    description: Use map data to estimate the appropriate speed to drive through turns ahead.
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
- id: custom_longitudinal
  title: Custom Longitudinal Policy (custom-2.0)
  description: ''
  enablement:
  - $ref: '#/macros/longitudinal'
  items:
  - key: CustomLongitudinalEnabled
    widget: toggle
    title: Custom Longitudinal
    description: Shape the stock longitudinal planner with the custom-2.0 policy for smoother launches and lead-following.
      It only shapes within the planner's safety envelope and never relaxes braking; off uses the stock planner.
    enablement:
    - $ref: '#/macros/longitudinal'
    sub_items:
    - key: CustomLongitudinalMode
      widget: multiple_button
      title: Longitudinal Mode
      description: Select the custom longitudinal policy mode while offroad. ACC keeps cruise + lead behavior, E2E relies on model stops/slowdowns, and SCC blends both.
      options:
      - value: acc
        label: ACC
      - value: e2e
        label: E2E
      - value: scc
        label: SCC
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/longitudinal'
      - type: param
        key: CustomLongitudinalEnabled
        equals: true
